<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commander — Portfolio For U</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo">Portfolio<span>ForU</span></a>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="tarifs.html">Tarifs</a>
        <a href="demos.html">Démos</a>
        <a href="commander.html" class="btn-primary">Commander</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 650px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 2rem;">Lance ta commande</h1>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Remplis le formulaire, aucun paiement avant validation de l'aperçu pour les formules sur-mesure.</p>
    </div>

    <!-- Formspree ID: xwlknvza -->
    <form action="https://formspree.io/f/xwlknvza" method="POST" enctype="multipart/form-data" class="surface-card">
      
      <div class="form-group">
        <label>Nom / Prénom *</label>
        <input type="text" name="name" required placeholder="Alex Dupont" />
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required placeholder="alex@example.com" />
      </div>

      <div class="form-group">
        <label>Formule choisie *</label>
        <select name="formula" required>
          <option value="express-20">Express — Fichiers seuls (20€)</option>
          <option value="express-30">Express — Clé en main (30€)</option>
          <option value="surmesure-40">Sur-Mesure — Fichiers seuls (40€)</option>
          <option value="surmesure-55" selected>Sur-Mesure — Clé en main (55€ - Aperçu gratuit)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Présentation &amp; Parcours</label>
        <textarea name="bio" rows="3" placeholder="Présente brièvement ton profil, tes études..."></textarea>
      </div>

      <div class="form-group">
        <label>Ton CV (PDF/Word)</label>
        <input type="file" name="attachment" accept=".pdf,.doc,.docx" />
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; margin-top: 12px;">Envoyer ma commande 🚀</button>
    </form>
  </main>

  <footer>
    <div class="footer-container">
      <div><strong>Portfolio<span style="color:var(--primary)">ForU</span></strong></div>
      <div><a href="mailto:hello.portfolioforu@outlook.com">hello.portfolioforu@outlook.com</a> | © 2026 portfolio-for-u.fr</div>
    </div>
  </footer>

</body>
</html>
